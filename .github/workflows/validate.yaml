# Name of the GitHub Actions workflow for validating Sigma detections and running unit tests.
name: Detection-as-Code CI

# Trigger the workflow on push and pull request events to ensure that any changes to the repository are validated and tested automatically.
on:
  push:
  pull_request:

# Define the jobs that will run as part of this workflow. In this case, there is a single job named "validate-and-test" that will run on the latest version of Ubuntu.
jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    # Define the steps that will be executed as part of the "validate-and-test" job. These steps include downloading the repository, setting up Python, installing dependencies, validating Sigma detections, and running unit tests.
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install sigma-cli pysigma
          sigma plugin install elasticsearch

      - name: Validate all Sigma detections
        run: python -m src.validator

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v
